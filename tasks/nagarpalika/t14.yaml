id: nag-14
site: nagarpalika
start_url: http://127.0.0.1:8101/services
instruction:
  en: "Apply for birth registration for Deepak Basnet (दीपक बस्नेत), ward 15, mobile 9878901234, citizenship no. ३५-०५-७६-०४८८८, date of birth (BS) given in AD as 1998-11-23 (convert to BS)."
  ne: "दीपक बस्नेतका लागि जन्म दर्ताको निवेदन दिनुहोस्: वडा १५, मोबाइल ९८७८९०१२३४, नागरिकता नं. ३५-०५-७६-०४८८८, जन्म मिति (वि.सं.) अंग्रेजी मितिमा १९९८-११-२३ (वि.सं.मा बदल्नुहोस्)."
