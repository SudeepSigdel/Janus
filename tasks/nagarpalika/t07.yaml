id: nag-07
site: nagarpalika
start_url: http://127.0.0.1:8101/services
instruction:
  en: "Apply for a residence recommendation for Ram Shrestha (राम श्रेष्ठ), ward 5, mobile 9812345678, citizenship no. २९-०३-७८-०५६७८, date of birth (BS) 2054-02-15."
  ne: "राम श्रेष्ठका लागि निवास सिफारिसको निवेदन दिनुहोस्: वडा ५, मोबाइल ९८१२३४५६७८, नागरिकता नं. २९-०३-७८-०५६७८, जन्म मिति (वि.सं.) २०५४-०२-१५।"
