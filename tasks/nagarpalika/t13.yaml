id: nag-13
site: nagarpalika
start_url: http://127.0.0.1:8101/services
instruction:
  en: "Apply for birth registration for Kabita Rai (कविता राई), ward 9, mobile 9867890123, citizenship no. ३४-०४-७५-०३७७७, date of birth (BS) 2061-05-30."
  ne: "कविता राईका लागि जन्म दर्ताको निवेदन दिनुहोस्: वडा ९, मोबाइल ९८६७८९०१२३, नागरिकता नं. ३४-०४-७५-०३७७७, जन्म मिति (वि.सं.) २०६१-०५-३०."
inputs:
  service: "birth-registration"
  name_ne: "कविता राई"
  citizenship_no: "३४-०४-७५-०३७७७"
  ward: "9"
  phone: "9867890123"
  dob_bs: "2061-05-30"
approvals:
  - action: submit_application
    names: ["अर्को / Next: review", "पेश गर्नुहोस् / Submit application"]
    path: "/apply/birth-registration*"
tags: [bilingual, numerals, multi_page]
success:
