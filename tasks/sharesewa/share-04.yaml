id: share-04
site: sharesewa
start_url: http://127.0.0.1:8102/login
instruction:
  en: "Log in (BOID ४२३४५६७८, password Sajilo@012) and apply for the Sunrise Bank Rights Issue with the maximum allowed 8000 kitta: bank Nabil Bank, CRN CRN-482904, transaction PIN ३४५६."
  ne: "लगइन गर्नुहोस् (वीओआईडी ४२३४५६७८, पासवर्ड Sajilo@012) र सनराइज बैंक हक निष्कासनका लागि अधिकतम ८००० कित्तामा आवेदन दिनुहोस्: नबिल बैंक, सीआरएन CRN-482904, ट्रान्जेक्सन पिन ३४५६।"
inputs:
  boid: "४२३४५६७८"
  password: "Sajilo@012"
  issue: "sunrise-bank-rights"
  bank: "nabil"
  kitta: "8000"
  crn: "CRN-482904"
  pin: "३४५६"
approvals:
  - apply_issue
sensitive_field_names:
  - pin
success:
  - {path: applications, op: count, value: 6}
  - {path: applications.046.issue, op: equals, value: "sunrise-bank-rights"}
  - {path: applications.046.bank, op: equals, value: "nabil"}
  - {path: applications.046.kitta, op: equals, value: 8000}
  - {path: applications.046.crn, op: equals, value: "CRN-482904"}
  - {path: applications.046.pin, op: equals, value: "३४५६"}
  - {path: applications.046.status, op: equals, value: "submitted"}
  - {path: applications.041.status, op: equals, value: "allotted"}
  - {path: applications.042.status, op: equals, value: "submitted"}
  - {path: applications.043.status, op: equals, value: "submitted"}
  - {path: applications.044.status, op: equals, value: "allotted"}
  - {path: applications.045.status, op: equals, value: "submitted"}
