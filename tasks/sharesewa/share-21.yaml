id: share-21
site: sharesewa
start_url: http://127.0.0.1:8102/login
instruction:
  en: "Log in (BOID १७३४५६७८, password Sajilo@357) and apply for the Sunrise Bank Rights Issue: bank Himalayan Bank, 4000 kitta, CRN CRN-482909, transaction PIN ४६८०."
  ne: "लगइन गर्नुहोस् (वीओआईडी १७३४५६७८, पासवर्ड Sajilo@357) र सनराइज बैंक हक निष्कासनका लागि आवेदन दिनुहोस्: हिमालयन बैंक, ४००० कित्ता, सीआरएन CRN-482909, ट्रान्जेक्सन पिन ४६८०।"
inputs:
  boid: "१७३४५६७८"
  password: "Sajilo@357"
  issue: "sunrise-bank-rights"
  bank: "himalayan"
  kitta: "4000"
  crn: "CRN-482909"
  pin: "४६८०"
approvals:
  - action: apply_issue
    names: ["अर्को / Next: review", "आवेदन पेश गर्नुहोस् / Submit application"]
    path: "/apply/sunrise-bank-rights*"
sensitive_field_names:
  - pin
tags: [bilingual, numerals, multi_page]
success:
