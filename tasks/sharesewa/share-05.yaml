id: share-05
site: sharesewa
start_url: http://127.0.0.1:8102/login
instruction:
  en: "Log in (BOID ५२३४५६७८, password Sajilo@345) and apply for the NIC Asia Debenture 2083 issue: bank Himalayan Bank, 3000 kitta, CRN CRN-482905, transaction PIN ७८९०."
  ne: "लगइन गर्नुहोस् (वीओआईडी ५२३४५६७८, पासवर्ड Sajilo@345) र एनआईसी एशिया डिबेन्चर २०८३ का लागि आवेदन दिनुहोस्: हिमालयन बैंक, ३००० कित्ता, सीआरएन CRN-482905, ट्रान्जेक्सन पिन ७८९०।"
inputs:
  boid: "५२३४५६७८"
  password: "Sajilo@345"
  issue: "nic-asia-debenture"
  bank: "himalayan"
  kitta: "3000"
  crn: "CRN-482905"
  pin: "७८९०"
approvals:
  - apply_issue
sensitive_field_names:
  - pin
tags: [bilingual, numerals, multi_page]
success:
