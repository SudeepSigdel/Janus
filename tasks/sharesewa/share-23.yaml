id: share-23
site: sharesewa
start_url: http://127.0.0.1:8102/login
instruction:
  en: "Log in (BOID २३३४५६७८, password Sajilo@642) and apply for the NIC Asia Debenture 2083 issue (not the 2082 issue and not Series B): bank Himalayan Bank, 100 kitta, CRN CRN-482906, transaction PIN २४६९."
