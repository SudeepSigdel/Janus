[project]
name = "janus"
version = "0.1.0"
description = "Safety-first browser agent for Nepali/Hindi/bilingual portals, plus an offline benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
bench = [
    "fastapi>=0.111",
    "jinja2>=3.1",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]
baseline = [
    "browser-use==0.13.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
janus = "janus.cli:main"
janus-bench = "janus_bench.harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus", "src/janus_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not browser and not ollama'"
markers = [
    "browser: Playwright against local replica sites",
    "ollama: needs a local Ollama server with models pulled",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
