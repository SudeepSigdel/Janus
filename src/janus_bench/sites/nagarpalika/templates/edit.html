{% extends "base.html" %}
{% block title %}सम्पादन / Edit{% endblock %}
{% block content %}
<h2>निवेदन नं. {{ application.id | ne }} सम्पादन / Edit application {{ application.id }}</h2>
<p>{{ application.name_ne }}</p>
<form method="post" action="/applications/{{ application.id }}/edit">
  <label for="phone">मोबाइल नं. / Mobile number</label>
  <input id="phone" name="phone" value="{{ application.phone }}">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <button type="submit" id="btn-save">सुरक्षित गर्नुहोस् / Save</button>
</form>
{% endblock %}
