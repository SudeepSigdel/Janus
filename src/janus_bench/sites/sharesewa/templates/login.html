{% extends "base.html" %}
{% block title %}लगइन / Login{% endblock %}
{% block content %}
<h2>लगइन / Login</h2>
<form method="post" action="/login">
  <label for="boid">वीओआईडी / BOID</label>
  <input id="boid" name="boid">

  <label for="password">पासवर्ड / Password</label>
  <input id="password" name="password" type="password">
  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <button type="submit" id="btn-login">लगइन / Login</button>
</form>
{% endblock %}
